sentence=Host driver for ERDI 905 nm laser rangefinder modules over UART.
paragraph=Implements the documented 8-byte UART frame protocol of the LR1000E2 family: single-shot and continuous ranging, stop, angle measurement, baud-rate selection and LD constant-on mode. Handles the two different checksum ranges used by transmit and response frames. Header-only, no dependencies, works on any board with a Stream.
